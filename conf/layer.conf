BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes*/*/*.bb \
    ${LAYERDIR}/recipes*/*/*.bbappend \
    ${LAYERDIR}/recipes*/*/*/*.bb \
    ${LAYERDIR}/recipes*/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "flatpak-minimal-layer"
BBFILE_PATTERN_flatpak-minimal-layer := "^${LAYERDIR}/"
# One above meta-flutter (12). The two Flutter app recipes here were moved out
# of meta-flutter-apps; if a build still carries a meta-flutter that has them,
# this layer wins at equal PV instead of the pick depending on layer order.
BBFILE_PRIORITY_flatpak-minimal-layer = "13"

LAYERDEPENDS_flatpak-minimal-layer = "core openembedded-layer"
LAYERRECOMMENDS_flatpak-minimal-layer = "flutter-layer"

LAYERSERIES_COMPAT_flatpak-minimal-layer = "wrynose blacksail"

# The Flutter apps need meta-flutter's classes and flutter-sdk-native, so they
# only parse when that layer is present.
BBFILES_DYNAMIC += " \
    flutter-layer:${LAYERDIR}/dynamic-layers/flutter-layer/*/*/*.bb \
    flutter-layer:${LAYERDIR}/dynamic-layers/flutter-layer/*/*/*.bbappend \
    flutter-layer:${LAYERDIR}/dynamic-layers/flutter-layer/*/*/*/*.bb \
    flutter-layer:${LAYERDIR}/dynamic-layers/flutter-layer/*/*/*/*.bbappend \
"
