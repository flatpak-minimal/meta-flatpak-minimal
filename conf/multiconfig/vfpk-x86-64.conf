#
# vfpk guest for qemux86-64 targets. The name, MACHINE and TMPDIR must agree with
# VFPK_ARCH_TABLE in classes/flatpak-common.bbclass.

DISTRO = "vfpk"
MACHINE = "qemux86-64"
TMPDIR = "${TOPDIR}/tmp-vfpk-x86-64"

# vfpk-tarball ships QEMU for this guest only.
QEMU_TARGETS:pn-nativesdk-qemu = "x86_64"
