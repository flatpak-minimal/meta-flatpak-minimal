#
# Flatpak runtimes for any riscv64 device (flatpak-bundle's
# FLATPAK_IMAGE_GENERIC). qemuriscv64 stands in for a machine; what matters
# is the tune: rv64gc, without the extensions a board's machine may enable
# (Zba, Zbb, vector). The distro and the rest of local.conf apply as usual.

# Refs deploy beside the main configuration's, under this multiconfig's
# name, where flatpak-bundle and flatpak-repo-index look for them. Taken
# before TMPDIR changes below.
FLATPAK_DEPLOY_DIR := "${DEPLOY_DIR}/flatpak"
FLATPAK_DEPLOY_ARCH = "${BB_CURRENT_MC}"

MACHINE = "qemuriscv64"
DEFAULTTUNE = "riscv64"
TMPDIR = "${TOPDIR}/tmp-vfpk-riscv64-generic"
