#
# Flatpak runtimes for any x86_64 device (flatpak-bundle's
# FLATPAK_IMAGE_GENERIC). qemux86-64 stands in for a machine; what matters is
# the tune: core2-64, which genericx86-64 builds for, instead of qemux86-64's
# x86-64-v3. Mesa's default x86 drivers (Intel, AMD, nouveau, llvmpipe)
# already cover the common GPUs. The distro and the rest of local.conf apply
# as usual.

# Refs deploy beside the main configuration's, under this multiconfig's
# name, where flatpak-bundle and flatpak-repo-index look for them. Taken
# before TMPDIR changes below.
FLATPAK_DEPLOY_DIR := "${DEPLOY_DIR}/flatpak"
FLATPAK_DEPLOY_ARCH = "${BB_CURRENT_MC}"

MACHINE = "qemux86-64"
DEFAULTTUNE = "core2-64"
TMPDIR = "${TOPDIR}/tmp-vfpk-x86-64-generic"
