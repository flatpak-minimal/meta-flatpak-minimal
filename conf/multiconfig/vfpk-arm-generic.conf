# Flatpak runtimes for any 32-bit arm device (flatpak-bundle's
# FLATPAK_IMAGE_GENERIC). qemuarm stands in for a machine; what matters is
# the tune: Armv7-A with NEON and hard float, instead of qemuarm's Armv7VE
# with VFPv4 and integer divide, which a Cortex-A9 (i.MX6) lacks. The distro
# and the rest of local.conf apply as usual.

# Refs deploy beside the main configuration's, under this multiconfig's
# name, where flatpak-bundle and flatpak-repo-index look for them. Taken
# before TMPDIR changes below.
FLATPAK_DEPLOY_DIR := "${DEPLOY_DIR}/flatpak"
FLATPAK_DEPLOY_ARCH = "${BB_CURRENT_MC}"

MACHINE = "qemuarm"
DEFAULTTUNE = "armv7athf-neon"
TMPDIR = "${TOPDIR}/tmp-vfpk-arm-generic"

# Mesa's Gallium drivers for the common Arm GPUs: Broadcom (Raspberry Pi),
# Vivante (i.MX), Adreno, Mali Utgard. panfrost (Mali Midgard and later)
# needs libclc, which builds clang; add it where that cost is acceptable.
PACKAGECONFIG:append:pn-mesa = " etnaviv freedreno lima v3d vc4"
