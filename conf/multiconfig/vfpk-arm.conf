#
# vfpk guest for qemuarm targets. The name, MACHINE and TMPDIR must agree with
# VFPK_ARCH_TABLE in classes/flatpak-common.bbclass.

DISTRO = "vfpk"
MACHINE = "qemuarm"
TMPDIR = "${TOPDIR}/tmp-vfpk-arm"

# vfpk-tarball ships QEMU for this guest only.
QEMU_TARGETS:pn-nativesdk-qemu = "arm"
