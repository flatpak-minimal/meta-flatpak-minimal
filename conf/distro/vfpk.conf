#
# vfpk: distro of the build-time flatpak guest. It only builds the kernel,
# the tiny initramfs and the squashfs root filesystem booted by
# vfpk-runner.sh, and is only used through the conf/multiconfig/vfpk-*.conf
# multiconfigs.
#
# A multiconfig still sees the main local.conf, so anything a product sets
# there with a hard assignment or an append reaches this distro too. The hard
# assignments below come after local.conf in parse order and win; features
# appended there are removed explicitly.

DISTRO = "vfpk"
DISTRO_NAME = "vfpk guest"
DISTRO_VERSION = "1.0"

# - seccomp: flatpak triggers run under bubblewrap with a seccomp filter
# - xattr, acl: ostree and flatpak preserve them where present
# - pci: the guest disks are virtio-blk-pci
DISTRO_FEATURES = "acl ext2 ipv4 ipv6 pci seccomp xattr"
DISTRO_FEATURES:remove = "3g alsa bluetooth gobject-introspection-data nfc opengl pam \
    pipewire polkit ptest pulseaudio systemd usrmerge vulkan wayland wifi x11 zeroconf"
# wrynose adds its default features unless they are opted out.
DISTRO_FEATURES_OPTED_OUT = "debuginfod gobject-introspection-data ldconfig multiarch nfs pulseaudio vfat"
DISTRO_FEATURES:class-native = ""
DISTRO_FEATURES:class-nativesdk = ""

# The guest has no init system: vfpk-preinit switches to /sbin/vfpk-init,
# which runs one command and powers off.
INIT_MANAGER = "mdev-busybox"
VIRTUAL-RUNTIME_login_manager = ""

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"

EXTRA_IMAGE_FEATURES = ""
IMAGE_LINGUAS = ""

# QEMU for vfpk-tarball: no display or GL. The multiconfigs set QEMU_TARGETS
# to the guest's arch.
PACKAGECONFIG:class-nativesdk:pn-nativesdk-qemu = "fdt kvm pie pixman slirp"
